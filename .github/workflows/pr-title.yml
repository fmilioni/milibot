name: PR title

# The PR title becomes the squash commit message, which drives semantic-release: it must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            daemon
            agent
            desktop
            shared
            vm
            ci
            deps
            deps-dev
            release
          requireScope: false
          subjectPattern: ^.+[^.]$
          subjectPatternError: 'Leave out the trailing period: "{subject}".'
