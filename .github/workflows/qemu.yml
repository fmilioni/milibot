name: QEMU

# Builds the QEMU the app ships (vm/qemu/build.sh) on every platform the app is packaged for and publishes
# the tarballs and their SHA256SUMS as the release qemu-<QEMU_VERSION>-<QEMU_BUILD> (vm/qemu/version.env).
# A published release is never changed: the app pins each tarball's sha256 (vm/host/src/tools/host-tools.ts),
# so a new package needs a new QEMU_BUILD. Runs when vm/qemu/ changes, or by hand.
on:
  push:
    paths:
      - vm/qemu/**
      - .github/workflows/qemu.yml
  workflow_dispatch:

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            platform: darwin
            arch: arm64
          # AlmaLinux 9 (glibc 2.34): the binaries run on every distro the app supports.
          - name: Linux x64
            runner: ubuntu-latest
            container: almalinux:9
            platform: linux
            arch: x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            container: almalinux:9
            platform: linux
            arch: arm64
          - name: Windows x64 (MinGW on Fedora)
            runner: ubuntu-latest
            container: fedora:43
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies (macOS)
        if: matrix.platform == 'darwin'
        run: brew install ninja pkgconf glib pixman
      - name: Build dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y gcc make ninja-build python3.11 python3.11-pip glib2-devel pixman-devel zlib-devel \
            bzip2 flex bison diffutils findutils xz tar patchelf perl git
      - name: Build dependencies (Windows cross)
        if: matrix.platform == 'win32'
        run: |
          dnf install -y make ninja-build python3 python3-pip bzip2 flex bison diffutils findutils xz tar perl git \
            glib2-devel mingw64-gcc mingw64-glib2 mingw64-pixman mingw64-zlib mingw64-pkg-config
      - name: Build
        env:
          QEMU_PYTHON: ${{ matrix.platform == 'linux' && 'python3.11' || '' }}
        run: bash vm/qemu/build.sh ${{ matrix.platform }} ${{ matrix.arch }} out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Create qemu-<version>-<build> unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . vm/qemu/version.env
          tag="qemu-$QEMU_VERSION-$QEMU_BUILD"
          cd out
          sha256sum *.tar.gz | tee SHA256SUMS
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; bump QEMU_BUILD in vm/qemu/version.env to publish a new package"
            exit 0
          fi
          gh release create "$tag" *.tar.gz SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "QEMU $QEMU_VERSION (build $QEMU_BUILD)" \
            --notes "QEMU $QEMU_VERSION built by vm/qemu/build.sh for the Milibot app. Not an app release." \
            --prerelease \
            --latest=false
